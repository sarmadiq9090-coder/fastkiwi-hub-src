[package]
name = "fastkiwi-hubcli"
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
description = "fastkiwi-hub-cli@1: the command-line contract between FastKiwi Hub and each app (docs/HUB-APP-CONTRACT.md). Parsing and validation only: no I/O."
license = "Apache-2.0"
publish = false

[lib]
name = "hubcli"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
