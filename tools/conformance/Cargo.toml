[package]
name = "fastkiwi-hub-conformance"
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
description = "Conformance harness for fastkiwi-hub-cli@1 (check-app) and a conforming stub app (stub-app) for its tests."
license = "LicenseRef-Proprietary"
publish = false

[lib]
name = "conformance"
path = "src/lib.rs"

[[bin]]
name = "check-app"
path = "src/bin/check_app.rs"

[[bin]]
name = "stub-app"
path = "src/bin/stub_app.rs"

[dependencies]
hubcli = { package = "fastkiwi-hubcli", path = "../../crates/hubcli" }
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.10.9"
getrandom = "0.3"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# The Hub's host side (src/hostproc.rs, src/hosting.rs), tested here against stub-app.
kiwi_hub = { package = "fastkiwi-hub", path = "../.." }
